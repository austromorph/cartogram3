# vim: set tabstop=2 softtabstop=2 shiftwidth=2 expandtab:

name: Create a release

on:
  push:
    tags:
      - v*.*.*
      - v*.*.*.dev*
      - v*.*.*.post*

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  build:
    name: Build plugin package
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: | 
          apt update -y
          apt install -y zip rsync
      - run:
          bash ./.github/workflows/package-plugin.sh
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: dist/*.*

  merge-into-stable:
    name: Update stable branch to point to this release
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(github.ref, 'dev')"
    permissions: write-all
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: stable
      - name: Merge tag into stable
        run: |
          TAG="${{github.ref}}"  # /ref/tags/v0.0.0
          git merge "${TAG:10}"
          git push

  deploy:
    name: Upload built wheel and source package to PyPi
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/r5py
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  release:
    name: Create a new release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: "!contains(github.ref, 'dev')"
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  prerelease:
    name: Create a new pre-release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: contains(github.ref, 'dev')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
